[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tistory-life-automation"
version = "0.1.0"
description = "Safe private-publishing foundation for Tistory"
requires-python = ">=3.10"
dependencies = [
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.18,<1.19",
  "pydantic-settings>=2.0,<3.0",
  "PyYAML>=6.0,<7.0",
  "playwright>=1.50,<2.0",
  "fastapi>=0.100.0",
  "uvicorn>=0.20.0",
  "jinja2>=3.1.0",
  "requests>=2.31,<3.0",
]

[project.optional-dependencies]
mysql = ["PyMySQL>=1.1,<2.0"]
test = ["pytest>=8.0,<10.0", "httpx2>=2.0,<3.0"]

[project.scripts]
tistory-automation = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
